# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# レビュー言語を日本語に設定
language: "ja-JP"

# レビューの基本設定
reviews:
  profile: "chill"                 # レビューの厳しさ (chill, assertive から選択)
  request_changes_workflow: false  # AIが自動で「変更をリクエスト」にするかどうか
  high_level_summary: true         # PRの概要サマリーを生成するか
  poem: true                       # PRの最後に短いポエム（要約）を追加するか
  review_status: true              # レビューの進行状況を表示するか
  collapse_walkthrough: false      # ウォークスルー（変更の解説）を折りたたむか

  # レビュー対象外のディレクトリ・ファイル
  path_filters:
    - "!user_front/**"

  # ディレクトリ・パスごとの個別ルール
  path_instructions:
    - path: "**"
      instructions: |
        このプロジェクト「Group Manager」は以下の技術スタックで構成されています:
        - 参加団体向けユーザー画面: Next.js 15
        - 実行委員向け管理者画面: Nuxt
        - バックエンドAPI: Ruby on Rails 6.1 (APIモード)
        - インフラ環境: Docker

        【全体のレビュー観点】
        - ESLintとPrettierの警告が解消されるようなコードになっているか確認してください。
        - 丁寧で分かりやすい日本語でレビューし、問題点の指摘だけでなく具体的な改善コード（提案）を提示してください。
        - コード生成・追加時は、既存のアーキテクチャパターンやコーディング規約の一貫性が保たれているか確認してください。

    - path: "api/**"
      instructions: |
        【バックエンド (Rails API) のルール】
        - Ruby on Rails 6.1のベストプラクティスに従っているか。
        - インデントは2スペース、命名規則は `snake_case` を徹底すること。
        - RESTfulなコントローラ設計になっているか。
        - データベースの変更がある場合、マイグレーションファイルが作成されているか。
        - `api/test` 配下に対応するテスト（正常系・バリデーション・失敗ケース）が追加・更新されているか。
        - N+1問題の発生や、セキュリティ上の懸念（SQLインジェクション等）がないか。

    - path: "user/**"
      instructions: |
        【ユーザー画面 (Next.js) のルール】
        - Next.js 15 および React のベストプラクティスに従っているか。
        - コンポーネント名は `PascalCase`、フックとユーティリティ名は `camelCase` になっているか。
        - スタイリングには Tailwind CSS を使用しているか。
        - レンダリングの最適化や、コンポーネントの再利用性が考慮されているか。

    - path: "admin_view/**"
      instructions: |
        【管理者画面 (Nuxt) のルール】
        - Nuxt および Vue のベストプラクティスに従っているか。
        - Vueファイル内の構成は `<template>` -> `<script>` -> `<style>` の順序になっているか。
        - インデントは2スペースになっているか。

# PRのコメント欄でのChatボット機能の設定
chat:
  auto_reply: true                 # メンションされた際に自動返信するかどうか

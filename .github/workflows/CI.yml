name: CI

on:
  push:
    branches:
      - main
      - feat/mitomen/2031/CI-CD-pipeline
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure Insecure Registry
        run: |
          sudo service docker stop
          echo "{\"insecure-registries\": [\"${{ secrets.HARBOR_REG }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo service docker start

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ secrets.HARBOR_REG }}"]
              http = true
              insecure = true

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REG }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Create user .env
        run: |
          printf '%s' "${{ secrets.USER_ENV }}" > user/.env

      - name: Create admin_view .env
        run: |
          printf '%s' "${{ secrets.ADMIN_VIEW_ENV }}" > admin_view/.env

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REG }}/group-manager/api:latest
          cache-from: type=gha

      - name: Build and Push User
        uses: docker/build-push-action@v5
        with:
          context: ./user
          file: ./user/prod.Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REG }}/group-manager/user:latest
          cache-from: type=gha

      - name: Build and Push Admin View
        uses: docker/build-push-action@v5
        with:
          context: ./admin_view
          file: ./admin_view/prod.Dockerfile
          push: true
          tags: ${{ secrets.HARBOR_REG }}/group-manager/admin:latest
          cache-from: type=gha

  trigger-cd:
    needs: build-and-push
    uses: ./.github/workflows/CD.yml
    secrets: inherit
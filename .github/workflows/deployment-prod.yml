name: CD

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Add deploy host key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -R "${{ secrets.CONTAINER_IP }}" 2>/dev/null || true
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: SSH and Deploy
        env:
          HARBOR_PASS: ${{ secrets.HARBOR_PASS }}
          HARBOR_REG: ${{ secrets.HARBOR_REG }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        run: |
          ssh deploy-user@${{ secrets.CONTAINER_IP }} -T \
            -o SendEnv=HARBOR_PASS \
            -o SendEnv=HARBOR_REG \
            -o SendEnv=HARBOR_USERNAME \
            bash -s << 'EOF'
            set -e
            cd /home/deploy-user/group-manager-2
            git fetch origin feat/mitomen/2031/CI-CD-pipeline
            git reset --hard origin/feat/mitomen/2031/CI-CD-pipeline
            git checkout -B feat/mitomen/2031/CI-CD-pipeline origin/feat/mitomen/2031/CI-CD-pipeline
            echo "$HARBOR_PASS" | docker login "$HARBOR_REG" -u "$HARBOR_USERNAME" --password-stdin
            docker compose -f compose.cd.yml pull
            docker compose -f compose.cd.yml up -d
            docker image prune -f
          EOF
name: CI Dev

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and deploy to dev"
        required: true
        default: "gm3/develop"
        type: string
  workflow_call:
    inputs:
      branch:
        description: "Branch to build and deploy to dev"
        required: false
        default: "gm3/develop"
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set image tag
        id: image-tag
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          echo "image_tag=dev-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure Insecure Registry
        run: |
          sudo service docker stop
          echo "{\"insecure-registries\": [\"${{ secrets.HARBOR_REG }}\"]}" | sudo tee /etc/docker/daemon.json
          sudo service docker start

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ secrets.HARBOR_REG }}"]
              http = true
              insecure = true

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REG }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REG }}/group-manager/api:${{ steps.image-tag.outputs.image_tag }}
            ${{ secrets.HARBOR_REG }}/group-manager/api:dev-latest
          cache-from: type=gha

      - name: Build and Push User
        uses: docker/build-push-action@v5
        with:
          context: ./user
          file: ./user/prod.Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REG }}/group-manager/user:${{ steps.image-tag.outputs.image_tag }}
            ${{ secrets.HARBOR_REG }}/group-manager/user:dev-latest
          cache-from: type=gha
          build-args: |
            NODE_ENV=${{ secrets.DEV_NODE_ENV }}
            APP_ENV=${{ secrets.DEV_APP_ENV }}
            NEXT_PUBLIC_IMGUR_CLIENT_ID=${{ secrets.DEV_NEXT_PUBLIC_IMGUR_CLIENT_ID }}
            IMGUR_CLIENT_SECRET=${{ secrets.DEV_IMGUR_CLIENT_SECRET }}
            NEXTAUTH_URL=${{ secrets.DEV_NEXTAUTH_URL }}
            NEXTAUTH_SECRET=${{ secrets.DEV_NEXTAUTH_SECRET }}

      - name: Build and Push Admin View
        uses: docker/build-push-action@v5
        with:
          context: ./admin_view
          file: ./admin_view/prod.Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_REG }}/group-manager/admin:${{ steps.image-tag.outputs.image_tag }}
            ${{ secrets.HARBOR_REG }}/group-manager/admin:dev-latest
          cache-from: type=gha
          build-args: |
            VUE_APP_URL=${{ secrets.DEV_VUE_APP_URL }}
            VUE_APP_API_URL=${{ secrets.DEV_VUE_APP_API_URL }}

  trigger-cd:
    needs: build-and-push
    uses: ./.github/workflows/deployment-dev.yml
    with:
      branch: ${{ inputs.branch }}
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
    secrets: inherit

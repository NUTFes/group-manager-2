name: CI

on:
  push:
    branches:
      - main
      - feat/mitomen/2031/CI-CD-pipeline
  workflow_call:
  workflow_dispatch:

concurrency:
  group: gm-ci
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}
      
      - name: Set image tag
        id: vars
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ghcr.io/nutfes/group-manager/api:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=gm-api
          cache-to: type=gha,mode=max,scope=gm-api

      - name: Build and Push User
        uses: docker/build-push-action@v7
        with:
          context: ./user
          file: ./user/prod.Dockerfile
          push: true
          tags: ghcr.io/nutfes/group-manager/user:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=gm-user
          cache-to: type=gha,mode=max,scope=gm-user
          build-args: |
            NODE_ENV=${{ secrets.NODE_ENV }}
            APP_ENV=${{ secrets.APP_ENV }}
            NEXT_PUBLIC_IMGUR_CLIENT_ID=${{ secrets.NEXT_PUBLIC_IMGUR_CLIENT_ID }}
            IMGUR_CLIENT_SECRET=${{ secrets.IMGUR_CLIENT_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

      - name: Build and Push Admin View
        uses: docker/build-push-action@v7
        with:
          context: ./admin_view
          file: ./admin_view/prod.Dockerfile
          push: true
          tags: ghcr.io/nutfes/group-manager/admin:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=gm-admin
          cache-to: type=gha,mode=max,scope=gm-admin
          build-args: |
            VUE_APP_URL=${{ secrets.VUE_APP_URL }}
            VUE_APP_API_URL=${{ secrets.VUE_APP_API_URL }}

  trigger-cd:
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deployment-prod.yml
    secrets: inherit

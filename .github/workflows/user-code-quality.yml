# Actionの名前
name: User Code Quality
description: ユーザディレクトリ以下に対してESLintとPrettierを実行し、フォーマットされた場合は自動でコミットする

on:
  # Pull Request時
  pull_request:
    # 対象のブランチを指定
    branches: ["gm3/develop"]

jobs:
  Code-Check:
    runs-on: ubuntu-latest
    steps:
      # GitHubリポジトリのコードをチェックアウト（fetch-depth: 0 にして完全な履歴を取得）
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Node.js v22をセットアップ
      - name: Use Node.js v22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # Corepack を有効にして pnpm を使えるようにする
      - name: Enable Corepack
        run: corepack enable

      # プロジェクトの依存関係をインストール（user ディレクトリ内）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./user

      # prettierでコードのフォーマットを実行
      - name: Format code with Prettier
        run: pnpm run fmt
        working-directory: ./user

      # 変更があれば、コミット＆プッシュする
      - name: Commit formatted files
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Action
          author_email: action@github.com
          message: "chore: auto format code"
          push: true

      # ESLintでコードをチェック
      - name: Check code lint
        run: pnpm run lint
        working-directory: ./user

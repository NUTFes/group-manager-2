      [get_all_rentable_items, get_inside_shop_rentable_items,
       get_outside_shop_rentable_items, get_stage_rentable_items]
    fes_dates: [index, show]
    group_categories: [index, show]
    news: [index, show]
    places: [index, show]
    rental_items: [index, show]
    shops: [index, show]

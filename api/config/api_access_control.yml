      [current_regist_info, edit_user_info, get_current_user_with_user_detail, get_user_detail_raw,
       is_login, password_reset]
    api/v1/food_products_api: [get_food_products_by_group_id]
    api/v1/users: [show]
    check_all_registered: [show]
    contact_persons: [create, destroy, index, show, update]

    purchase_lists: [create, destroy, get_by_food_product_id, index, show, update, upsert_all]
    rental_orders: [create, destroy, get_by_group_id, index, show, update]
    stage_common_options: [create, destroy, get_by_group_id, index, show, update]
    stage_orders: [create, destroy, get_by_group_id, index, show, update]

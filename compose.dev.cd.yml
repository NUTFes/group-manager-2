services:
  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: dev-cloudflare
    volumes:
      - ./cloudflare/dev:/home/nonroot/.cloudflared
    command: tunnel run

  api:
    image: ${HARBOR_REG}/group-manager/api:${IMAGE_TAG:-dev-latest}
    container_name: dev-api
    env_file: [.env.dev]

  user:
    image: ${HARBOR_REG}/group-manager/user:${IMAGE_TAG:-dev-latest}
    container_name: dev-view
    ports:
      - "8103:3000"
    env_file: [.env.dev]

  admin_view:
    image: ${HARBOR_REG}/group-manager/admin:${IMAGE_TAG:-dev-latest}
    container_name: dev-admin
    env_file: [.env.dev]
    ports:
      - "8100:3000"

  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: "dev-dozzle-agent"
    ports: ["7107:7007"]
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  default:
    name: group-manager-dev-default

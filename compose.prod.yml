services:
  cloudflare:
    image: cloudflare/cloudflared
    container_name: cloudflare
    volumes:
      - ./cloudflare/prod:/home/nonroot/.cloudflared
    command: tunnel run

  api:
    build:
      context: ./api
      dockerfile: prod.Dockerfile
    container_name: prod-api
    volumes: [./api:/myapp]

  user:
    build:
      context: ./user
      dockerfile: prod.Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_IMGUR_CLIENT_ID=${NEXT_PUBLIC_IMGUR_CLIENT_ID}
        - IMGUR_CLIENT_SECRET=${IMGUR_CLIENT_SECRET}
    container_name: prod-view
    ports:
      - "3000:3000"

  # 旧
  # user_front:
  #   build: ./user_front
  #   container_name: "GM2-USER-FRONT"
  #   command: bash -c "npm run start"
  #   volumes: [./user_front:/app]
  #   env_file: [group-manager-2.env]
  #   depends_on: [api]

  admin_view:
    build:
      context: ./admin_view
      dockerfile: prod.Dockerfile
      args:
        - API_URL=${API_URL}
        - APP_API_URL=${APP_API_URL}
    container_name: prod-admin
